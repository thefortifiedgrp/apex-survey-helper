name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Lets the job mint the OIDC token npm exchanges for a short-lived publish
  # credential. Without this, trusted publishing can't authenticate.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1, which Node 22 does not ship
          # (it carries npm 10.9.x). Node 24 plus an explicit upgrade keeps the
          # npm version deterministic rather than tied to whatever the runner
          # image happens to bundle.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build

      # Opens/updates a "Version Packages" PR when changesets are present;
      # when that PR is merged, publishes the three packages to npm.
      #
      # Auth is npm trusted publishing (OIDC) — no NPM_TOKEN. The publisher is
      # configured per package on npmjs.com and matched on this workflow's
      # filename (`release.yml`), so renaming this file breaks publishing until
      # the trusted publisher config is updated to match.
      #
      # Deliberately no token fallback: npm prefers an NPM_TOKEN/NODE_AUTH_TOKEN
      # when one is present and never attempts the OIDC exchange, so leaving one
      # configured would silently mean trusted publishing is never exercised.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
